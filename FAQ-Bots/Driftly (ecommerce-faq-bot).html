<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Driftly — Support</title>

<!-- ============================================================
  CONFIG — Edit this block to customize for any e-commerce client
  ============================================================ -->
<script>
const CONFIG = {
  // Branding
  storeName: "Driftly",
  storeTagline: "Modern Living, Delivered.",
  logoEmoji: "🛍️",

  // Colors
  colorPrimary: "#1a3a2a",     // deep forest green
  colorAccent: "#e8c97e",      // warm gold
  colorBg: "#faf7f2",          // warm cream
  colorBubbleUser: "#1a3a2a",
  colorBubbleBot: "#ffffff",

  // Groq API
  groqApiKey: "Your-Groq-API-Key-Here",
  groqModel: "llama-3.1-8b-instant",

  // Welcome
  welcomeMessage: "Hey there! 👋 I'm Driftly's support assistant. Ask me anything about orders, shipping, returns, or our products!",

  // Quick suggestions
  suggestions: [
    "How long does shipping take?",
    "What's your return policy?",
    "Do you ship internationally?",
    "How do I track my order?"
  ],

  // Knowledge base — paste FAQ content here
  knowledgeBase: `
You are a helpful customer support assistant for Driftly, a premium e-commerce store specializing in modern home décor and lifestyle products.

STORE INFO:
- Website: driftly.store
- Email: support@driftly.store
- Hours: Mon–Fri, 9AM–6PM EST

SHIPPING:
- Standard shipping: 5–7 business days (Free on orders over $75)
- Express shipping: 2–3 business days ($14.99)
- Overnight shipping available at checkout (pricing varies by location)
- International shipping available to 50+ countries (10–18 business days, $24.99 flat rate)
- Orders placed before 1PM EST are processed the same business day

ORDER TRACKING:
- A tracking link is emailed automatically once your order is dispatched
- You can also track your order on our website using your order number
- Orders are typically dispatched within 1–2 business days of purchase

RETURNS & REFUNDS:
- 30-day hassle-free return policy
- Items must be unused and in original packaging
- To initiate a return, email support@driftly.store with your order number
- Refunds are processed within 5–7 business days after the return is received
- Damaged or defective items are replaced at no charge — no return required
- Sale items are final sale and not eligible for returns

PAYMENTS:
- Accepted methods: Visa, Mastercard, American Express, PayPal, Apple Pay, Google Pay
- All transactions are secured with SSL encryption
- Installment options available via Shop Pay (where applicable)

PRODUCTS:
- All products come with a 1-year quality guarantee
- Product dimensions, materials, and care instructions are listed on each product page
- Custom and bulk orders available — contact support for a quote
- Gift wrapping available for $4.99 per item

CANCELLATIONS:
- Orders can be cancelled within 1 hour of placement
- Once dispatched, cancellation is not possible — but you may initiate a return upon delivery

Always be warm, concise, and helpful. If you don't know the answer, apologize and direct the customer to support@driftly.store.
  `
};
</script>
<!-- ============================================================ -->

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #1a3a2a;
    --accent: #e8c97e;
    --bg: #faf7f2;
    --surface: #ffffff;
    --text: #1c1c1c;
    --text-muted: #6b6b6b;
    --border: #e8e2d9;
    --radius: 16px;
    --shadow: 0 8px 32px rgba(26,58,42,0.10);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(232,201,126,0.13) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(26,58,42,0.07) 0%, transparent 60%);
  }

  /* ── Top Bar ── */
  .store-bar {
    width: 100%;
    max-width: 480px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    padding: 14px 20px;
    background: var(--primary);
    border-radius: var(--radius) var(--radius) 0 0;
    color: white;
  }

  .store-logo {
    font-size: 22px;
    line-height: 1;
  }

  .store-info h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.02em;
    line-height: 1;
  }

  .store-info p {
    font-size: 11px;
    color: rgba(255,255,255,0.6);
    margin-top: 2px;
    font-weight: 300;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .status-dot {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: rgba(255,255,255,0.7);
  }

  .status-dot::before {
    content: '';
    width: 7px; height: 7px;
    background: #5dde7f;
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ── Chat Window ── */
  .chat-window {
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 var(--radius) var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    height: 560px;
    overflow: hidden;
  }

  /* ── Messages ── */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .msg {
    display: flex;
    gap: 8px;
    max-width: 88%;
    animation: fadeUp 0.3s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.bot  { align-self: flex-start; }

  .avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }

  .msg.bot .avatar  { background: var(--primary); color: var(--accent); font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 13px; }
  .msg.user .avatar { background: var(--accent); color: var(--primary); font-size: 12px; }

  .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.55;
    color: var(--text);
  }

  .msg.bot .bubble {
    background: #f5f3ef;
    border-radius: 4px 14px 14px 14px;
    border: 1px solid var(--border);
  }

  .msg.user .bubble {
    background: var(--primary);
    color: #fff;
    border-radius: 14px 4px 14px 14px;
  }

  /* typing indicator */
  .typing-bubble {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 12px 16px;
    background: #f5f3ef;
    border: 1px solid var(--border);
    border-radius: 4px 14px 14px 14px;
    width: fit-content;
  }

  .typing-bubble span {
    width: 6px; height: 6px;
    background: var(--primary);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
    opacity: 0.5;
  }

  .typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
  .typing-bubble span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-5px); opacity: 1; }
  }

  /* ── Suggestions ── */
  .suggestions {
    padding: 10px 16px 8px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    border-top: 1px solid var(--border);
    background: #fdfbf8;
  }

  .suggestion-btn {
    padding: 6px 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    background: transparent;
    border: 1px solid var(--primary);
    color: var(--primary);
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .suggestion-btn:hover {
    background: var(--primary);
    color: var(--accent);
  }

  /* ── Input Bar ── */
  .input-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: #fff;
    border-top: 1px solid var(--border);
  }

  .input-bar input {
    flex: 1;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: 24px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    outline: none;
    transition: border-color 0.2s;
  }

  .input-bar input:focus { border-color: var(--primary); }
  .input-bar input::placeholder { color: var(--text-muted); }

  .send-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--primary);
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, transform 0.1s;
    flex-shrink: 0;
  }

  .send-btn:hover  { background: #254d38; }
  .send-btn:active { transform: scale(0.93); }

  .send-btn svg { width: 16px; height: 16px; fill: var(--accent); }

  /* ── Footer ── */
  .powered {
    margin-top: 14px;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.03em;
  }

  .powered span { color: var(--primary); font-weight: 500; }
</style>
</head>
<body>

<div class="store-bar" id="storeBar">
  <div class="store-logo" id="storeLogo"></div>
  <div class="store-info">
    <h1 id="storeName"></h1>
    <p id="storeTagline"></p>
  </div>
  <div class="status-dot">Online</div>
</div>

<div class="chat-window">
  <div class="messages" id="messages"></div>

  <div class="suggestions" id="suggestionsRow"></div>

  <div class="input-bar">
    <input type="text" id="userInput" placeholder="Ask something…" autocomplete="off" />
    <button class="send-btn" id="sendBtn" aria-label="Send">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<p class="powered">Powered by <span>AI Chatbot</span> · Built on Fiverr by KumailH12</p>

<script>
// Apply CONFIG
document.documentElement.style.setProperty('--primary', CONFIG.colorPrimary);
document.documentElement.style.setProperty('--accent', CONFIG.colorAccent);
document.getElementById('storeLogo').textContent = CONFIG.logoEmoji;
document.getElementById('storeName').textContent = CONFIG.storeName;
document.getElementById('storeTagline').textContent = CONFIG.storeTagline;

// Render suggestions
const suggestionsRow = document.getElementById('suggestionsRow');
CONFIG.suggestions.forEach(text => {
  const btn = document.createElement('button');
  btn.className = 'suggestion-btn';
  btn.textContent = text;
  btn.onclick = () => sendMessage(text);
  suggestionsRow.appendChild(btn);
});

const messagesEl = document.getElementById('messages');
const inputEl    = document.getElementById('userInput');
const sendBtnEl  = document.getElementById('sendBtn');

let conversationHistory = [];

function appendMessage(role, text) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'bot' ? CONFIG.storeName[0] : '👤';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;

  wrap.appendChild(avatar);
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return wrap;
}

function showTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';
  wrap.id = 'typing';

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = CONFIG.storeName[0];

  const bubble = document.createElement('div');
  bubble.className = 'typing-bubble';
  bubble.innerHTML = '<span></span><span></span><span></span>';

  wrap.appendChild(avatar);
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

async function sendMessage(text) {
  const msg = (text || inputEl.value).trim();
  if (!msg) return;

  inputEl.value = '';
  sendBtnEl.disabled = true;
  suggestionsRow.style.display = 'none';

  appendMessage('user', msg);
  conversationHistory.push({ role: 'user', content: msg });

  showTyping();

  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${CONFIG.groqApiKey}`
      },
      body: JSON.stringify({
        model: CONFIG.groqModel,
        messages: [
          { role: 'system', content: CONFIG.knowledgeBase.trim() },
          ...conversationHistory
        ],
        temperature: 0.4,
        max_tokens: 400
      })
    });

    const data = await res.json();
    removeTyping();

    const reply = data?.choices?.[0]?.message?.content || "Sorry, I couldn't process that. Please email support@driftly.store.";
    conversationHistory.push({ role: 'assistant', content: reply });
    appendMessage('bot', reply);

  } catch (err) {
    removeTyping();
    appendMessage('bot', "Oops! Something went wrong. Please try again or contact support@driftly.store.");
    console.error(err);
  }

  sendBtnEl.disabled = false;
  inputEl.focus();
}

// Initial welcome message
window.addEventListener('load', () => {
  setTimeout(() => appendMessage('bot', CONFIG.welcomeMessage), 400);
});

// Events
sendBtnEl.addEventListener('click', () => sendMessage());
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
</script>
</body>
</html>
