<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Knowledge Base Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=Mulish:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --accent:     #7c3aed;
    --accent2:    #a78bfa;
    --bg:         #0d0d14;
    --bg-card:    #13121c;
    --bg-input:   #1c1a28;
    --bg-bubble:  #1c1a28;
    --text-main:  #ede9fe;
    --text-muted: #6b6887;
    --border:     rgba(124,58,237,0.18);
    --radius:     14px;
    --font-display:'Syne', sans-serif;
    --font-body:  'Mulish', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: var(--font-body);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background-image:
      radial-gradient(ellipse at 30% 20%, rgba(124,58,237,0.08) 0%, transparent 55%),
      radial-gradient(ellipse at 80% 80%, rgba(167,139,250,0.05) 0%, transparent 50%);
  }

  .chat-widget {
    width: 100%;
    max-width: 430px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 22px;
    display: flex;
    flex-direction: column;
    height: 640px;
    box-shadow: 0 24px 80px rgba(124,58,237,0.15), 0 0 0 1px rgba(124,58,237,0.08);
    overflow: hidden;
  }

  /* Header */
  .chat-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 13px;
    flex-shrink: 0;
    background: linear-gradient(180deg, rgba(124,58,237,0.08) 0%, transparent 100%);
  }

  .avatar {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: linear-gradient(135deg, #7c3aed, #a78bfa);
    display: flex; align-items: center; justify-content: center;
    font-size: 19px;
    flex-shrink: 0;
    box-shadow: 0 4px 16px rgba(124,58,237,0.4);
  }

  .header-name {
    font-family: var(--font-display);
    font-size: 15.5px;
    font-weight: 600;
    color: var(--text-main);
  }

  .header-sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
    font-weight: 300;
    letter-spacing: 0.3px;
  }

  .header-right { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }

  .online-pill {
    display: flex; align-items: center; gap: 5px;
    background: rgba(124,58,237,0.12);
    border: 1px solid rgba(124,58,237,0.25);
    border-radius: 20px;
    padding: 3px 9px;
    font-size: 10px;
    color: var(--accent2);
    font-weight: 500;
  }

  .dot { width: 5px; height: 5px; border-radius: 50%; background: #4ade80; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

  /* Suggested questions */
  .suggestions {
    padding: 10px 14px 8px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .suggestions-label {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 7px;
    font-weight: 500;
  }

  .suggestions-row {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .suggestions-row::-webkit-scrollbar { display: none; }

  .suggestion-btn {
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: var(--font-body);
    font-size: 11px;
    padding: 5px 11px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    font-weight: 400;
  }
  .suggestion-btn:hover {
    border-color: var(--accent);
    color: var(--accent2);
    background: rgba(124,58,237,0.08);
  }

  /* Messages */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scrollbar-width: thin;
    scrollbar-color: rgba(124,58,237,0.2) transparent;
  }
  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-thumb { background: rgba(124,58,237,0.2); border-radius: 2px; }

  .message { display: flex; gap: 9px; animation: fadeUp 0.25s ease both; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(7px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .message.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 28px; height: 28px;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    margin-top: 2px;
  }
  .message.bot .msg-avatar { background: linear-gradient(135deg, #7c3aed, #a78bfa); }
  .message.user .msg-avatar { background: var(--bg-input); border: 1px solid var(--border); }

  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 13px;
    line-height: 1.65;
    font-weight: 300;
  }

  .message.bot .bubble {
    background: var(--bg-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    color: var(--text-main);
  }

  .message.user .bubble {
    background: linear-gradient(135deg, #7c3aed, #6d28d9);
    border-bottom-right-radius: 4px;
    color: #fff;
    box-shadow: 0 4px 14px rgba(124,58,237,0.3);
  }

  .bubble strong { color: var(--accent2); font-weight: 600; }
  .message.user .bubble strong { color: #ddd6fe; }

  /* Source tag */
  .source-tag {
    display: inline-block;
    background: rgba(124,58,237,0.12);
    border: 1px solid rgba(124,58,237,0.2);
    color: var(--accent2);
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 20px;
    margin-top: 6px;
    font-weight: 500;
    letter-spacing: 0.3px;
  }

  /* Typing */
  .typing-indicator { display: flex; gap: 4px; align-items: center; padding: 2px 0; }
  .typing-indicator span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent2); opacity: 0.4;
    animation: bounce 1.2s infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* Input */
  .chat-input-area {
    padding: 10px 12px 12px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: flex-end;
    flex-shrink: 0;
    background: linear-gradient(0deg, rgba(124,58,237,0.03) 0%, transparent 100%);
  }

  .chat-input {
    flex: 1;
    background: var(--bg-input);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 9px 13px;
    color: var(--text-main);
    font-family: var(--font-body);
    font-size: 13px;
    resize: none;
    outline: none;
    line-height: 1.5;
    min-height: 40px;
    max-height: 90px;
    transition: border-color 0.2s;
    font-weight: 300;
  }
  .chat-input::placeholder { color: var(--text-muted); }
  .chat-input:focus { border-color: rgba(124,58,237,0.5); }

  .send-btn {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, #7c3aed, #6d28d9);
    border: none; border-radius: 12px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    box-shadow: 0 4px 14px rgba(124,58,237,0.35);
  }
  .send-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(124,58,237,0.45); }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .chat-footer {
    text-align: center;
    font-size: 10px;
    color: var(--text-muted);
    padding: 0 14px 9px;
    letter-spacing: 0.3px;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<!-- ============================================================
  🧠  AI KNOWLEDGE BASE / FAQ CHATBOT TEMPLATE
  ============================================================
  HOW TO CUSTOMIZE FOR EACH CLIENT:
  1. Update CONFIG below (company name, FAQ content, suggestions)
  2. Paste client's FAQ/policy/product info into KNOWLEDGE_BASE
  3. Add your GROQ_API_KEY (free from console.groq.com)
  4. Done — deliver or embed. Works for ANY business type.

  WORKS GREAT FOR:
  - E-commerce stores (product FAQs, shipping, returns)
  - Clinics / hospitals (services, booking, insurance)
  - Law firms (services, consultation info)
  - SaaS products (feature FAQs, pricing, onboarding)
  - Schools / universities (admissions, programs, fees)
  ============================================================ -->

<div class="chat-widget">
  <div class="chat-header">
    <div class="avatar">🧠</div>
    <div>
      <div class="header-name" id="headerName">Loading...</div>
      <div class="header-sub" id="headerSub">Knowledge Assistant</div>
    </div>
    <div class="header-right">
      <div class="online-pill"><span class="dot"></span> Online</div>
    </div>
  </div>

  <div class="suggestions">
    <div class="suggestions-label">Suggested questions</div>
    <div class="suggestions-row" id="suggestionsRow"></div>
  </div>

  <div class="chat-messages" id="chatMessages"></div>

  <div class="chat-input-area">
    <textarea class="chat-input" id="chatInput" placeholder="Ask me anything..." rows="1"></textarea>
    <button class="send-btn" id="sendBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

  <div class="chat-footer" id="chatFooter">Powered by AI · Available 24/7</div>
</div>

<script>
// ============================================================
//  ✏️  CLIENT CONFIGURATION
// ============================================================
const CONFIG = {
  // --- API ---
  GROQ_API_KEY: "Your-Groq-API-Key-Here",  // Get a free API key at console.groq.com
  GROQ_MODEL: "llama-3.3-70b-versatile",

  // --- 🎨 BRANDING — only change these two lines per client ---
  colorPrimary:   "#7c3aed",   // main color: buttons, avatar, user bubbles
  colorSecondary: "#7c3aed",   // border glow color (can be same as primary)

  // --- Chat Log (Google Sheets) ---
  // 📋 HOW TO SET UP (one time per client):
  //   1. Create a new Google Sheet for this client
  //   2. Go to Extensions → Apps Script → paste the doPost() function
  //   3. Deploy as Web App → copy the URL → paste it below
  //   Leave as "" to disable logging
  CHAT_LOG_WEBHOOK: "",

  // --- Company Info ---
  name:    "NovaTech Solutions",
  tagline: "SaaS Platform Support",
  type:    "SaaS company",   // e.g. "e-commerce store", "dental clinic", "law firm"
  phone:   "+1 (888) 123-4567",
  email:   "support@novatech.io",
  website: "https://novatech.io",

  // --- Suggested Questions (shown as buttons) ---
  suggestions: [
    "What plans do you offer?",
    "How do I cancel?",
    "Is there a free trial?",
    "How does billing work?",
    "Do you offer refunds?",
  ],

  // --- Welcome Message ---
  welcomeMessage: "Hi! 👋 I'm NovaTech's AI support assistant. I can answer questions about our plans, billing, features, and more — instantly, 24/7.\n\nWhat can I help you with today?",

  // ============================================================
  //  📋  KNOWLEDGE BASE — Paste your client's FAQ/info here
  //  This is what the AI reads to answer questions.
  //  The more detail you add, the better the answers.
  // ============================================================
  KNOWLEDGE_BASE: `
COMPANY: NovaTech Solutions
TYPE: Project management SaaS platform
WEBSITE: https://novatech.io
SUPPORT EMAIL: support@novatech.io
PHONE: +1 (888) 123-4567
SUPPORT HOURS: Monday–Friday, 9 AM – 6 PM EST

PLANS & PRICING:
- Starter: $9/month — up to 3 users, 5 projects, 5GB storage, basic features
- Pro: $29/month — up to 15 users, unlimited projects, 50GB storage, advanced analytics
- Business: $79/month — unlimited users, unlimited projects, 200GB storage, priority support, custom integrations
- Enterprise: Custom pricing — dedicated account manager, SLA, SSO, on-premise option
- All plans billed monthly or annually (annual = 2 months free)

FREE TRIAL:
- 14-day free trial available on all plans
- No credit card required to start
- Full access to Pro features during trial
- Upgrade or downgrade anytime

FEATURES:
- Task management with drag-and-drop Kanban boards
- Time tracking and project timelines (Gantt charts)
- Team collaboration: comments, file sharing, @mentions
- Integrations: Slack, Google Drive, Zapier, GitHub, Jira
- Mobile apps: iOS and Android
- API access available on Pro and above
- Custom workflows and automation on Business+

BILLING & PAYMENTS:
- Accepted: Visa, Mastercard, PayPal, bank transfer (Enterprise only)
- Invoices sent automatically every billing cycle
- Change or cancel plan anytime from account settings
- No setup fees

CANCELLATION & REFUNDS:
- Cancel anytime — no cancellation fees
- Monthly plans: access until end of billing period, no refund
- Annual plans: pro-rated refund within 30 days of purchase
- After 30 days, no refunds on annual plans
- Data export available before account deletion

SECURITY & PRIVACY:
- SOC 2 Type II certified
- Data encrypted at rest (AES-256) and in transit (TLS 1.2+)
- GDPR compliant
- Two-factor authentication available
- Regular security audits

GETTING STARTED:
- Sign up at novatech.io/signup
- Invite team members from Settings > Team
- Import existing projects via CSV or from Asana/Trello
- Video tutorials available at novatech.io/help

COMMON ISSUES:
- Forgot password: Click "Forgot password" on login page, reset link sent to email
- Can't invite team member: Check if you've reached your plan's user limit
- Slow performance: Try clearing browser cache or switching browsers
- Integration not working: Reconnect from Settings > Integrations
`,
};
// ============================================================
//  END OF CONFIGURATION
// ============================================================

function buildSystemPrompt() {
  return `You are the AI support assistant for ${CONFIG.name}, a ${CONFIG.type}.
Answer customer questions accurately and helpfully using ONLY the knowledge base below.

${CONFIG.KNOWLEDGE_BASE}

CONTACT INFO:
  Phone: ${CONFIG.phone}
  Email: ${CONFIG.email}
  Website: ${CONFIG.website}

RULES:
- Answer in a friendly, clear, concise tone.
- Use **bold** for key terms, prices, and important info.
- If the answer is in the knowledge base, answer confidently.
- If the question is NOT covered in the knowledge base, say so honestly and direct them to ${CONFIG.email} or ${CONFIG.phone}.
- Never make up information not in the knowledge base.
- Keep answers concise (3–5 sentences). Use bullet points for lists.
- Today is ${new Date().toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'})}.`;
}

// DOM
const chatMessages = document.getElementById("chatMessages");
const chatInput    = document.getElementById("chatInput");
const sendBtn      = document.getElementById("sendBtn");

// Init
document.getElementById("headerName").textContent = CONFIG.name;
document.getElementById("headerSub").textContent  = CONFIG.tagline;
document.getElementById("chatFooter").textContent = `${CONFIG.name} · AI Support`;
document.title = `${CONFIG.name} Support`;

const sugRow = document.getElementById("suggestionsRow");
CONFIG.suggestions.forEach(q => {
  const btn = document.createElement("button");
  btn.className = "suggestion-btn";
  btn.textContent = q;
  btn.onclick = () => sendMessage(q);
  sugRow.appendChild(btn);
});

const messages = [];
let isTyping = false;

addMessage("bot", CONFIG.welcomeMessage);

function formatText(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
    .replace(/\n- /g, "<br>• ")
    .replace(/\n/g, "<br>");
}

function addMessage(role, text) {
  const wrapper = document.createElement("div");
  wrapper.className = `message ${role}`;

  const avatar = document.createElement("div");
  avatar.className = "msg-avatar";
  avatar.textContent = role === "bot" ? "🧠" : "👤";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = formatText(text);

  if (role === "bot" && messages.length > 0) {
    const tag = document.createElement("div");
    tag.className = "source-tag";
    tag.textContent = "📚 Knowledge Base";
    bubble.appendChild(tag);
  }

  wrapper.appendChild(avatar);
  wrapper.appendChild(bubble);
  chatMessages.appendChild(wrapper);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function showTyping() {
  const wrapper = document.createElement("div");
  wrapper.className = "message bot";
  wrapper.id = "typingIndicator";
  const avatar = document.createElement("div");
  avatar.className = "msg-avatar";
  avatar.textContent = "🧠";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
  wrapper.appendChild(avatar);
  wrapper.appendChild(bubble);
  chatMessages.appendChild(wrapper);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById("typingIndicator");
  if (el) el.remove();
}

// ============================================================
//  🎨  BRANDING — applies CONFIG colors to CSS variables
// ============================================================
function applyBranding() {
  const r = document.documentElement.style;
  r.setProperty('--accent',  CONFIG.colorPrimary);
  r.setProperty('--accent2', lightenHex(CONFIG.colorPrimary, 40));
  r.setProperty('--border',  hexToRgba(CONFIG.colorSecondary, 0.18));
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function lightenHex(hex, amount) {
  const r = Math.min(255, parseInt(hex.slice(1,3),16) + amount);
  const g = Math.min(255, parseInt(hex.slice(3,5),16) + amount);
  const b = Math.min(255, parseInt(hex.slice(5,7),16) + amount);
  return `rgb(${r},${g},${b})`;
}

applyBranding();

// ============================================================
//  📋  CHAT LOGGING → Google Sheets
// ============================================================
function logChat(userMessage, botReply) {
  if (!CONFIG.CHAT_LOG_WEBHOOK) return;
  fetch(CONFIG.CHAT_LOG_WEBHOOK, {
    method: "POST",
    body: JSON.stringify({
      userMessage,
      botReply,
      botType: "FAQ / Knowledge Base Bot",
    }),
  }).catch(() => {}); // silent fail — never disrupts chat
}

async function sendMessage(text) {
  const userText = (text || chatInput.value).trim();
  if (!userText || isTyping) return;

  chatInput.value = "";
  chatInput.style.height = "auto";
  isTyping = true;
  sendBtn.disabled = true;

  addMessage("user", userText);
  messages.push({ role: "user", content: userText });
  showTyping();

  try {
    if (CONFIG.GROQ_API_KEY === "YOUR_GROQ_API_KEY_HERE") throw new Error("API_KEY_MISSING");

    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${CONFIG.GROQ_API_KEY}`,
      },
      body: JSON.stringify({
        model: "llama-3.3-70b-versatile",
        max_tokens: 400,
        messages: [
          { role: "system", content: buildSystemPrompt() },
          ...messages,
        ],
      }),
    });

    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    const reply = data.choices[0].message.content;

    removeTyping();
    addMessage("bot", reply);
    messages.push({ role: "assistant", content: reply });
    logChat(userText, reply);

  } catch (err) {
    removeTyping();
    const errMsg = err.message === "API_KEY_MISSING"
      ? "⚠️ Please add your Groq API key in the CONFIG section. Free key at **console.groq.com**"
      : `I'm having a technical issue right now. Please reach us at **${CONFIG.email}** for help.`;
    addMessage("bot", errMsg);
  }

  isTyping = false;
  sendBtn.disabled = false;
  chatInput.focus();
}

sendBtn.addEventListener("click", () => sendMessage());
chatInput.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
chatInput.addEventListener("input", () => {
  chatInput.style.height = "auto";
  chatInput.style.height = Math.min(chatInput.scrollHeight, 90) + "px";
});
</script>
</body>
</html>
