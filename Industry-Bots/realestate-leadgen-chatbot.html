<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Real Estate Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --accent:      #2563eb;
    --accent-light:#3b82f6;
    --bg:          #f8fafc;
    --bg-card:     #ffffff;
    --bg-input:    #f1f5f9;
    --text-main:   #0f172a;
    --text-muted:  #64748b;
    --bot-bubble:  #f1f5f9;
    --user-bubble: #2563eb;
    --border:      #e2e8f0;
    --radius:      14px;
    --font-display:'Playfair Display', serif;
    --font-body:   'Inter', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: linear-gradient(135deg, #e0e7ff 0%, #f0f9ff 50%, #f8fafc 100%);
    font-family: var(--font-body);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .chat-widget {
    width: 100%;
    max-width: 430px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    height: 640px;
    box-shadow: 0 20px 60px rgba(37,99,235,0.12), 0 4px 16px rgba(0,0,0,0.06);
    overflow: hidden;
  }

  /* Header */
  .chat-header {
    padding: 18px 20px;
    background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
    display: flex;
    align-items: center;
    gap: 13px;
    flex-shrink: 0;
  }

  .avatar {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    backdrop-filter: blur(4px);
  }

  .header-name {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 600;
    color: #fff;
  }

  .header-sub {
    font-size: 11px;
    color: rgba(255,255,255,0.7);
    margin-top: 2px;
    font-weight: 300;
    letter-spacing: 0.3px;
  }

  .header-badge {
    margin-left: auto;
    background: rgba(255,255,255,0.15);
    color: #fff;
    font-size: 10px;
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: 500;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }

  /* Progress bar */
  .progress-bar {
    padding: 10px 18px 8px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 10.5px;
    color: var(--text-muted);
    margin-bottom: 5px;
    font-weight: 400;
  }

  .progress-track {
    height: 4px;
    background: var(--bg-input);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-light));
    border-radius: 2px;
    transition: width 0.5s ease;
    width: 0%;
  }

  /* Quick buttons */
  .quick-buttons {
    display: flex;
    gap: 6px;
    padding: 10px 14px 8px;
    overflow-x: auto;
    scrollbar-width: none;
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
  }
  .quick-buttons::-webkit-scrollbar { display: none; }

  .quick-btn {
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: var(--font-body);
    font-size: 11px;
    padding: 5px 11px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    font-weight: 400;
  }
  .quick-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: #eff6ff;
  }

  /* Messages */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 11px;
    scrollbar-width: thin;
    scrollbar-color: #cbd5e1 transparent;
  }
  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }

  .message {
    display: flex;
    gap: 9px;
    animation: fadeUp 0.25s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .message.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 28px; height: 28px;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    margin-top: 2px;
  }

  .message.bot .msg-avatar {
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    color: white;
  }

  .message.user .msg-avatar {
    background: var(--bg-input);
    border: 1px solid var(--border);
  }

  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 13px;
    line-height: 1.65;
    font-weight: 400;
  }

  .message.bot .bubble {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    color: var(--text-main);
  }

  .message.user .bubble {
    background: var(--user-bubble);
    border-bottom-right-radius: 4px;
    color: #fff;
  }

  .bubble strong { color: var(--accent); font-weight: 600; }
  .message.user .bubble strong { color: #bfdbfe; }

  /* Lead collected card */
  .lead-card {
    background: linear-gradient(135deg, #eff6ff, #f0fdf4);
    border: 1px solid #bbf7d0;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 12px;
    color: #166534;
    margin-top: 4px;
  }
  .lead-card-title { font-weight: 600; font-size: 12.5px; margin-bottom: 4px; }

  /* Typing */
  .typing-indicator { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
  .typing-indicator span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); opacity: 0.4;
    animation: bounce 1.2s infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* Input */
  .chat-input-area {
    padding: 10px 12px 12px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: flex-end;
    flex-shrink: 0;
  }

  .chat-input {
    flex: 1;
    background: var(--bg-input);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 9px 13px;
    color: var(--text-main);
    font-family: var(--font-body);
    font-size: 13px;
    resize: none;
    outline: none;
    line-height: 1.5;
    min-height: 40px;
    max-height: 90px;
    transition: border-color 0.2s;
    font-weight: 400;
  }
  .chat-input::placeholder { color: var(--text-muted); }
  .chat-input:focus { border-color: var(--accent); }

  .send-btn {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    border: none; border-radius: 12px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    box-shadow: 0 4px 12px rgba(37,99,235,0.3);
  }
  .send-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(37,99,235,0.4); }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .chat-footer {
    text-align: center;
    font-size: 10px;
    color: var(--text-muted);
    padding: 0 14px 9px;
    letter-spacing: 0.3px;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div class="chat-widget">
  <div class="chat-header">
    <div class="avatar">🏠</div>
    <div>
      <div class="header-name" id="headerName">Loading...</div>
      <div class="header-sub" id="headerSub">Real Estate</div>
    </div>
    <div class="header-badge" id="headerBadge">Free Consultation</div>
  </div>

  <div class="progress-bar">
    <div class="progress-label">
      <span>Lead qualification</span>
      <span id="progressText">0% complete</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="quick-buttons" id="quickButtons"></div>
  <div class="chat-messages" id="chatMessages"></div>

  <div class="chat-input-area">
    <textarea class="chat-input" id="chatInput" placeholder="Type your message..." rows="1"></textarea>
    <button class="send-btn" id="sendBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

  <div class="chat-footer" id="chatFooter">AI-powered lead assistant</div>
</div>

<script>

const CONFIG = {
  // --- API ---
  GROQ_API_KEY: "YOUR_GROQ_API_KEY_HERE",

  // --- 🎨 BRANDING — only change these two lines per client ---
  colorPrimary:   "#2563eb",   // main color: buttons, avatar, user bubbles
  colorSecondary: "#2563eb",   // border glow color (can be same as primary)

  // --- Leads Webhook (optional but powerful) ---
  // Use Make.com or Zapier → Google Sheets to capture leads automatically
  // Leave empty string "" to disable
  LEADS_WEBHOOK_URL: "",

  // --- Chat Log (Google Sheets) ---
  // 📋 HOW TO SET UP (one time per client):
  //   1. Create a new Google Sheet for this client
  //   2. Go to Extensions → Apps Script → paste the doPost() function
  //   3. Deploy as Web App → copy the URL → paste it below
  //   Leave as "" to disable logging
  CHAT_LOG_WEBHOOK: "",

  // --- Agency Info ---
  name:    "Prime Properties",
  tagline: "Your Trusted Real Estate Partner",
  city:    "Miami, Florida",
  phone:   "+1 (305) 456-7890",
  whatsapp:"+13054567890",
  email:   "leads@primeproperties.com",
  website: "https://primeproperties.com",

  // --- Agent ---
  agentName:  "Sarah Mitchell",
  agentTitle: "Senior Property Consultant",

  // --- Areas Covered ---
  areas: [
    "Downtown Miami", "Brickell", "Coral Gables",
    "Coconut Grove", "Wynwood", "South Beach",
    "Aventura", "Doral"
  ],

  // --- Property Types ---
  propertyTypes: [
    "Apartments & Condos",
    "Single Family Homes",
    "Townhouses",
    "Luxury Penthouses",
    "Commercial Spaces",
    "Investment Properties",
  ],

  // --- Budget Ranges ---
  budgetRanges: [
    "Under $300K",
    "$300K – $600K",
    "$600K – $1M",
    "$1M – $2M",
    "$2M+",
  ],

  // --- Services ---
  services: [
    "Buying a property",
    "Selling a property",
    "Renting / leasing",
    "Property investment advice",
    "Property valuation",
    "Relocation assistance",
  ],

  // --- Quick Buttons ---
  quickButtons: [
    { label: "🏠 Buy Property",   message: "I want to buy a property" },
    { label: "💰 Sell Property",  message: "I want to sell my property" },
    { label: "🏢 Rent",           message: "I'm looking to rent" },
    { label: "📍 Areas",          message: "What areas do you cover?" },
    { label: "📞 Talk to Agent",  message: "I want to speak with an agent" },
  ],

  // --- Welcome Message ---
  welcomeMessage: "Hi there! 👋 Welcome to **Prime Properties**. I'm your AI property assistant — I'm here to help you find your perfect home or investment in Miami.\n\nTo get started, are you looking to **buy**, **sell**, or **rent** a property?",
};
// ============================================================
//  END OF CONFIGURATION
// ============================================================

// Lead collection state
const lead = {
  intent:   null,  // buy / sell / rent
  area:     null,
  type:     null,
  budget:   null,
  timeline: null,
  name:     null,
  phone:    null,
  email:    null,
};

const LEAD_FIELDS = ["intent","area","type","budget","timeline","name","phone","email"];

function getLeadProgress() {
  const filled = LEAD_FIELDS.filter(k => lead[k] !== null).length;
  return Math.round((filled / LEAD_FIELDS.length) * 100);
}

function updateProgress() {
  const pct = getLeadProgress();
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").textContent = pct + "% complete";
}

function buildLeadSummary() {
  return Object.entries(lead)
    .filter(([,v]) => v !== null)
    .map(([k,v]) => `  ${k}: ${v}`)
    .join("\n");
}

function buildSystemPrompt() {
  return `You are an AI lead qualification assistant for ${CONFIG.name}, a real estate agency in ${CONFIG.city}.
Your job is to have a natural conversation and collect the following information from the prospect:
1. Intent (buy/sell/rent)
2. Preferred area/neighborhood
3. Property type they're interested in
4. Budget range
5. Timeline (how soon they want to act)
6. Their name
7. Their phone number
8. Their email address

AGENCY INFO:
  Agency: ${CONFIG.name}
  City: ${CONFIG.city}
  Areas covered: ${CONFIG.areas.join(", ")}
  Property types: ${CONFIG.propertyTypes.join(", ")}
  Budget ranges: ${CONFIG.budgetRanges.join(", ")}
  Services: ${CONFIG.services.join(", ")}
  Agent: ${CONFIG.agentName} (${CONFIG.agentTitle})
  Phone: ${CONFIG.phone}
  Email: ${CONFIG.email}

CURRENT LEAD DATA COLLECTED SO FAR:
${buildLeadSummary() || "  (nothing yet)"}

RULES:
- Be warm, professional, and conversational. Never sound like a form.
- Ask ONE question at a time — never ask multiple questions at once.
- Collect the missing info naturally through conversation.
- When you extract a new piece of info from the user's message, output it on a new line at the very end in this exact format:
  LEAD_UPDATE: field_name = value
  (field names: intent, area, type, budget, timeline, name, phone, email)
- Once you have name + phone or email, say: "Perfect! I have everything I need. LEAD_COMPLETE"
- Keep replies concise (2–3 sentences max).
- If someone asks about properties, answer helpfully then gently steer back to qualifying them.
- Today is ${new Date().toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'})}.`;
}

// DOM
const chatMessages = document.getElementById("chatMessages");
const chatInput    = document.getElementById("chatInput");
const sendBtn      = document.getElementById("sendBtn");

// Init
document.getElementById("headerName").textContent = CONFIG.name;
document.getElementById("headerSub").textContent  = CONFIG.tagline;
document.getElementById("chatFooter").textContent = `${CONFIG.name} · AI Lead Assistant`;
document.title = `${CONFIG.name} Assistant`;

const qbContainer = document.getElementById("quickButtons");
CONFIG.quickButtons.forEach(btn => {
  const el = document.createElement("button");
  el.className = "quick-btn";
  el.textContent = btn.label;
  el.onclick = () => sendMessage(btn.message);
  qbContainer.appendChild(el);
});

const messages = [];
let isTyping = false;
let leadComplete = false;

addMessage("bot", CONFIG.welcomeMessage);

function formatText(text) {
  // Remove LEAD_UPDATE lines from display
  const clean = text.replace(/LEAD_UPDATE:.*$/gm, "").replace(/LEAD_COMPLETE/g, "").trim();
  return clean
    .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
    .replace(/\n/g, "<br>");
}

function addMessage(role, text, extra) {
  const wrapper = document.createElement("div");
  wrapper.className = `message ${role}`;

  const avatar = document.createElement("div");
  avatar.className = "msg-avatar";
  avatar.textContent = role === "bot" ? "🏠" : "👤";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = formatText(text);

  wrapper.appendChild(avatar);
  wrapper.appendChild(bubble);

  if (extra) wrapper.appendChild(extra);
  chatMessages.appendChild(wrapper);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function showLeadCard() {
  const card = document.createElement("div");
  card.className = "lead-card";
  const filled = LEAD_FIELDS.filter(k => lead[k] !== null);
  card.innerHTML = `<div class="lead-card-title">✅ Lead Captured!</div>` +
    filled.map(k => `<div><strong>${k}:</strong> ${lead[k]}</div>`).join("");

  const wrapper = document.createElement("div");
  wrapper.className = "message bot";
  const avatar = document.createElement("div");
  avatar.className = "msg-avatar";
  avatar.textContent = "🏠";
  wrapper.appendChild(avatar);
  wrapper.appendChild(card);
  chatMessages.appendChild(wrapper);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function sendLeadToWebhook() {
  if (!CONFIG.LEADS_WEBHOOK_URL) return;
  fetch(CONFIG.LEADS_WEBHOOK_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ...lead, agency: CONFIG.name, timestamp: new Date().toISOString() }),
  }).catch(() => {});
}

function parseLeadUpdates(text) {
  const lines = text.split("\n");
  let updated = false;
  lines.forEach(line => {
    const match = line.match(/LEAD_UPDATE:\s*(\w+)\s*=\s*(.+)/);
    if (match) {
      const field = match[1].trim();
      const value = match[2].trim();
      if (LEAD_FIELDS.includes(field)) {
        lead[field] = value;
        updated = true;
      }
    }
  });
  if (updated) updateProgress();

  if (text.includes("LEAD_COMPLETE") && !leadComplete) {
    leadComplete = true;
    setTimeout(() => {
      showLeadCard();
      sendLeadToWebhook();
    }, 600);
  }
}

function showTyping() {
  const wrapper = document.createElement("div");
  wrapper.className = "message bot";
  wrapper.id = "typingIndicator";
  const avatar = document.createElement("div");
  avatar.className = "msg-avatar";
  avatar.textContent = "🏠";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
  wrapper.appendChild(avatar);
  wrapper.appendChild(bubble);
  chatMessages.appendChild(wrapper);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById("typingIndicator");
  if (el) el.remove();
}

// ============================================================
//  🎨  BRANDING — applies CONFIG colors to CSS variables
// ============================================================
function applyBranding() {
  const r = document.documentElement.style;
  r.setProperty('--accent',      CONFIG.colorPrimary);
  r.setProperty('--accent-light', lightenHex(CONFIG.colorPrimary, 30));
  r.setProperty('--user-bubble',  CONFIG.colorPrimary);
  r.setProperty('--border',       hexToRgba(CONFIG.colorSecondary, 0.18));
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function lightenHex(hex, amount) {
  const r = Math.min(255, parseInt(hex.slice(1,3),16) + amount);
  const g = Math.min(255, parseInt(hex.slice(3,5),16) + amount);
  const b = Math.min(255, parseInt(hex.slice(5,7),16) + amount);
  return `rgb(${r},${g},${b})`;
}

applyBranding();

// ============================================================
//  📋  CHAT LOGGING → Google Sheets
// ============================================================
function logChat(userMessage, botReply) {
  if (!CONFIG.CHAT_LOG_WEBHOOK) return;
  fetch(CONFIG.CHAT_LOG_WEBHOOK, {
    method: "POST",
    body: JSON.stringify({
      userMessage,
      botReply,
      botType: "Real Estate Lead Gen Bot",
    }),
  }).catch(() => {}); // silent fail — never disrupts chat
}

async function sendMessage(text) {
  const userText = (text || chatInput.value).trim();
  if (!userText || isTyping) return;

  chatInput.value = "";
  chatInput.style.height = "auto";
  isTyping = true;
  sendBtn.disabled = true;

  addMessage("user", userText);
  messages.push({ role: "user", content: userText });
  showTyping();

  try {
    if (CONFIG.GROQ_API_KEY === "YOUR_GROQ_API_KEY_HERE") throw new Error("API_KEY_MISSING");

    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${CONFIG.GROQ_API_KEY}`,
      },
      body: JSON.stringify({
        model: "llama-3.3-70b-versatile",
        max_tokens: 350,
        messages: [
          { role: "system", content: buildSystemPrompt() },
          ...messages,
        ],
      }),
    });

    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    const reply = data.choices[0].message.content;

    removeTyping();
    parseLeadUpdates(reply);
    addMessage("bot", reply);
    messages.push({ role: "assistant", content: reply });
    logChat(userText, reply);

  } catch (err) {
    removeTyping();
    const errMsg = err.message === "API_KEY_MISSING"
      ? "⚠️ Please add your Groq API key in the CONFIG section. Free key at **console.groq.com**"
      : `I'm having a technical issue. Please contact **${CONFIG.agentName}** directly at **${CONFIG.phone}**.`;
    addMessage("bot", errMsg);
  }

  isTyping = false;
  sendBtn.disabled = false;
  chatInput.focus();
}

sendBtn.addEventListener("click", () => sendMessage());
chatInput.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
chatInput.addEventListener("input", () => {
  chatInput.style.height = "auto";
  chatInput.style.height = Math.min(chatInput.scrollHeight, 90) + "px";
});
</script>
</body>
</html>
