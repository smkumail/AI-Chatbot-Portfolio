<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Restaurant Chat Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  /* ============================================================
     EASY CUSTOMIZATION — Change colors/fonts here
  ============================================================ */
  :root {
    --accent:       #c9a84c;   /* gold accent — change to brand color */
    --bg-dark:      #0f0e0c;
    --bg-card:      #1a1814;
    --bg-input:     #221f1a;
    --text-main:    #f0ebe0;
    --text-muted:   #8a7f6e;
    --bot-bubble:   #1f1c17;
    --user-bubble:  #2a2318;
    --border:       rgba(201,168,76,0.18);
    --radius:       14px;
    --font-display: 'Cormorant Garamond', serif;
    --font-body:    'DM Sans', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-dark);
    font-family: var(--font-body);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(201,168,76,0.04) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(201,168,76,0.03) 0%, transparent 50%);
  }

  /* ── Widget Container ── */
  .chat-widget {
    width: 100%;
    max-width: 420px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    height: 620px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.6), 0 0 0 1px rgba(201,168,76,0.08);
    overflow: hidden;
    position: relative;
  }

  /* ── Header ── */
  .chat-header {
    padding: 18px 22px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    background: linear-gradient(180deg, rgba(201,168,76,0.06) 0%, transparent 100%);
    flex-shrink: 0;
  }

  .avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #8a6820);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    box-shadow: 0 0 16px rgba(201,168,76,0.3);
  }

  .header-info { flex: 1; }

  .header-name {
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 600;
    color: var(--text-main);
    letter-spacing: 0.3px;
  }

  .header-status {
    font-size: 11.5px;
    color: var(--accent);
    font-weight: 300;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 2px;
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #4caf7d;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .header-powered {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 300;
    letter-spacing: 0.4px;
  }

  /* ── Quick Buttons ── */
  .quick-buttons {
    display: flex;
    gap: 7px;
    padding: 12px 16px 10px;
    overflow-x: auto;
    scrollbar-width: none;
    flex-shrink: 0;
    border-bottom: 1px solid rgba(201,168,76,0.08);
  }

  .quick-buttons::-webkit-scrollbar { display: none; }

  .quick-btn {
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: var(--font-body);
    font-size: 11.5px;
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    font-weight: 400;
    letter-spacing: 0.2px;
  }

  .quick-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(201,168,76,0.06);
  }

  /* ── Messages ── */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scrollbar-width: thin;
    scrollbar-color: rgba(201,168,76,0.2) transparent;
  }

  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-track { background: transparent; }
  .chat-messages::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.2); border-radius: 2px; }

  .message {
    display: flex;
    gap: 10px;
    animation: fadeUp 0.3s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .message.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    margin-top: 2px;
  }

  .message.bot .msg-avatar {
    background: linear-gradient(135deg, var(--accent), #8a6820);
    box-shadow: 0 0 10px rgba(201,168,76,0.2);
  }

  .message.user .msg-avatar {
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-muted);
  }

  .bubble {
    max-width: 78%;
    padding: 11px 15px;
    border-radius: var(--radius);
    font-size: 13.5px;
    line-height: 1.6;
    font-weight: 300;
  }

  .message.bot .bubble {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    color: var(--text-main);
  }

  .message.user .bubble {
    background: var(--user-bubble);
    border: 1px solid rgba(201,168,76,0.15);
    border-bottom-right-radius: 4px;
    color: var(--text-main);
  }

  .bubble strong { color: var(--accent); font-weight: 500; }

  /* typing indicator */
  .typing-indicator { display: flex; gap: 5px; align-items: center; padding: 4px 2px; }
  .typing-indicator span {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.4;
    animation: bounce 1.2s infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* ── Input Area ── */
  .chat-input-area {
    padding: 12px 14px 14px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
    background: linear-gradient(0deg, rgba(201,168,76,0.03) 0%, transparent 100%);
  }

  .chat-input {
    flex: 1;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    color: var(--text-main);
    font-family: var(--font-body);
    font-size: 13.5px;
    font-weight: 300;
    resize: none;
    outline: none;
    line-height: 1.5;
    min-height: 42px;
    max-height: 100px;
    transition: border-color 0.2s;
  }

  .chat-input::placeholder { color: var(--text-muted); }
  .chat-input:focus { border-color: rgba(201,168,76,0.4); }

  .send-btn {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--accent), #a07830);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    box-shadow: 0 4px 14px rgba(201,168,76,0.25);
  }

  .send-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(201,168,76,0.35); }
  .send-btn:active { transform: translateY(0); }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .send-btn svg { stroke: #0f0e0c; }

  /* ── Footer ── */
  .chat-footer {
    text-align: center;
    font-size: 10.5px;
    color: var(--text-muted);
    padding: 0 14px 10px;
    letter-spacing: 0.3px;
    flex-shrink: 0;
  }

  /* ── Embed Badge (remove if not needed) ── */
  .embed-note {
    position: fixed;
    bottom: 16px; right: 16px;
    font-size: 10px;
    color: rgba(255,255,255,0.2);
    font-family: var(--font-body);
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="chat-widget" id="chatWidget">

  <!-- Header -->
  <div class="chat-header">
    <div class="avatar">🍽️</div>
    <div class="header-info">
      <div class="header-name" id="headerName">Loading...</div>
      <div class="header-status">
        <span class="status-dot"></span>
        <span id="headerTagline">Online</span>
      </div>
    </div>
    <div class="header-powered">AI Assistant</div>
  </div>

  <!-- Quick Action Buttons -->
  <div class="quick-buttons" id="quickButtons"></div>

  <!-- Messages -->
  <div class="chat-messages" id="chatMessages"></div>

  <!-- Input -->
  <div class="chat-input-area">
    <textarea
      class="chat-input"
      id="chatInput"
      placeholder="Ask about our menu, hours, or reservations..."
      rows="1"
    ></textarea>
    <button class="send-btn" id="sendBtn" title="Send">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

  <div class="chat-footer" id="chatFooter">Powered by AI · Built for your business</div>
</div>

<div class="embed-note">restaurant-chatbot-template.html</div>

<script>
// ============================================================
//  ✏️  CLIENT CONFIGURATION — Edit this for each client
// ============================================================
const CONFIG = {
  // --- API ---
  GROQ_API_KEY: "your groq api key here",  // Get free key: console.groq.com

  // --- 🎨 BRANDING — only change these two lines per client ---
  colorPrimary:   "#c9a84c",   // main color: buttons, avatar, user bubbles
  colorSecondary: "#c9a84c",   // border glow color (can be same as primary)

  // --- Chat Log (Google Sheets) ---
  // 📋 HOW TO SET UP (one time per client):
  //   1. Create a new Google Sheet for this client
  //   2. Go to Extensions → Apps Script → paste the doPost() function
  //   3. Deploy as Web App → copy the URL → paste it below
  //   Leave as "" to disable logging
  CHAT_LOG_WEBHOOK: "",

  // --- Restaurant Info ---
  name:        "Bella Cucina",
  tagline:     "Fine Italian Dining · Est. 2010",
  cuisine:     "Italian",
  location:    "42 Rosewood Lane, Downtown",
  phone:       "+1 (555) 234-5678",
  whatsapp:    "+15552345678",   // for WhatsApp reservation link
  website:     "https://bellacucina.com",

  // --- Hours ---
  hours: {
    "Monday":    "Closed",
    "Tuesday":   "12:00 PM – 10:00 PM",
    "Wednesday": "12:00 PM – 10:00 PM",
    "Thursday":  "12:00 PM – 10:00 PM",
    "Friday":    "12:00 PM – 11:00 PM",
    "Saturday":  "11:00 AM – 11:00 PM",
    "Sunday":    "11:00 AM – 9:00 PM",
  },

  // --- Menu (keep concise — AI reads this) ---
  menu: {
    "Starters": [
      "Bruschetta al Pomodoro – $9",
      "Burrata Caprese – $14",
      "Calamari Fritti – $13",
    ],
    "Pasta": [
      "Spaghetti Carbonara – $22",
      "Pappardelle al Ragù – $24",
      "Truffle Tagliatelle – $28",
      "Gnocchi al Pesto – $20",
    ],
    "Mains": [
      "Branzino al Forno – $34",
      "Bistecca Fiorentina – $48",
      "Chicken Piccata – $26",
      "Mushroom Risotto – $22",
    ],
    "Desserts": [
      "Tiramisu – $10",
      "Panna Cotta – $9",
      "Tartufo al Cioccolato – $11",
    ],
    "Drinks": [
      "House Red/White Wine – $12/glass",
      "Aperol Spritz – $13",
      "San Pellegrino – $4",
      "Espresso / Americano – $4",
    ],
  },

  // --- Reservations ---
  reservations: "Call us at +1 (555) 234-5678 or WhatsApp us to reserve a table.",

  // --- Special Notes ---
  notes: [
    "We offer vegetarian and gluten-free options — ask your server.",
    "Private dining available for groups of 10+.",
    "Valet parking available on weekends.",
  ],

  // --- Quick Action Buttons ---
  quickButtons: [
    { label: "📋 Menu",        message: "Show me your full menu" },
    { label: "🕐 Hours",       message: "What are your opening hours?" },
    { label: "📍 Location",    message: "Where are you located?" },
    { label: "📞 Reservations",message: "How can I make a reservation?" },
    { label: "🌿 Veg Options", message: "Do you have vegetarian options?" },
  ],

  // --- Welcome Message ---
  welcomeMessage: "Buonasera! 👋 Welcome to **Bella Cucina**. I'm your AI dining assistant. I can help you with our menu, opening hours, reservations, and more. How can I assist you today?",
};
// ============================================================
//  END OF CONFIGURATION
// ============================================================


// Build system prompt from config
function buildSystemPrompt() {
  const hoursText = Object.entries(CONFIG.hours)
    .map(([day, time]) => `  ${day}: ${time}`)
    .join("\n");

  const menuText = Object.entries(CONFIG.menu)
    .map(([cat, items]) => `  ${cat}:\n${items.map(i => "    - " + i).join("\n")}`)
    .join("\n");

  const notesText = CONFIG.notes.map(n => "  - " + n).join("\n");

  return `You are the friendly AI assistant for ${CONFIG.name}, a ${CONFIG.cuisine} restaurant.
Your job is to help guests with questions about the menu, hours, reservations, location, and anything related to the restaurant.

RESTAURANT INFO:
  Name: ${CONFIG.name}
  Cuisine: ${CONFIG.cuisine}
  Location: ${CONFIG.location}
  Phone: ${CONFIG.phone}
  Website: ${CONFIG.website}

OPENING HOURS:
${hoursText}

MENU:
${menuText}

RESERVATIONS:
  ${CONFIG.reservations}
  WhatsApp: https://wa.me/${CONFIG.whatsapp.replace(/\D/g, "")}

SPECIAL NOTES:
${notesText}

RULES:
- Be warm, friendly, and concise. Use a conversational tone.
- Use simple formatting — bold key items with **asterisks**, use bullet points when listing items.
- If asked about prices, share them from the menu above.
- For reservations, always provide the WhatsApp link as a clickable suggestion.
- If you don't know something, say so honestly and suggest they call the restaurant.
- Do NOT make up dishes, prices, or information not listed above.
- Keep replies short (2–4 sentences max) unless showing the full menu.
- Today is ${new Date().toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'})}.`;
}

// ── State ──
const messages = [];
let isTyping = false;

// ── DOM ──
const chatMessages = document.getElementById("chatMessages");
const chatInput    = document.getElementById("chatInput");
const sendBtn      = document.getElementById("sendBtn");

// ── Init UI from config ──
document.getElementById("headerName").textContent    = CONFIG.name;
document.getElementById("headerTagline").textContent = CONFIG.tagline;
document.getElementById("chatFooter").textContent    = `${CONFIG.name} · AI Assistant`;
document.title = `${CONFIG.name} Chat`;

// Quick buttons
const qbContainer = document.getElementById("quickButtons");
CONFIG.quickButtons.forEach(btn => {
  const el = document.createElement("button");
  el.className = "quick-btn";
  el.textContent = btn.label;
  el.onclick = () => sendMessage(btn.message);
  qbContainer.appendChild(el);
});

// Welcome message
addMessage("bot", CONFIG.welcomeMessage);

// ── Helpers ──
function formatText(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
    .replace(/\n/g, "<br>");
}

function addMessage(role, text) {
  const wrapper = document.createElement("div");
  wrapper.className = `message ${role}`;

  const avatar = document.createElement("div");
  avatar.className = "msg-avatar";
  avatar.textContent = role === "bot" ? "🍽️" : "👤";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = formatText(text);

  wrapper.appendChild(avatar);
  wrapper.appendChild(bubble);
  chatMessages.appendChild(wrapper);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  return wrapper;
}

function showTyping() {
  const wrapper = document.createElement("div");
  wrapper.className = "message bot";
  wrapper.id = "typingIndicator";

  const avatar = document.createElement("div");
  avatar.className = "msg-avatar";
  avatar.textContent = "🍽️";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;

  wrapper.appendChild(avatar);
  wrapper.appendChild(bubble);
  chatMessages.appendChild(wrapper);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById("typingIndicator");
  if (el) el.remove();
}

// ── Send Message ──
// ============================================================
//  🎨  BRANDING — applies CONFIG colors to CSS variables
// ============================================================
function applyBranding() {
  const r = document.documentElement.style;
  r.setProperty('--accent', CONFIG.colorPrimary);
  r.setProperty('--border', hexToRgba(CONFIG.colorSecondary, 0.18));
  // user bubble matches primary
  r.setProperty('--user-bubble', hexToRgba(CONFIG.colorPrimary, 0.15));
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

applyBranding();

// ============================================================
//  📋  CHAT LOGGING → Google Sheets
// ============================================================
function logChat(userMessage, botReply) {
  if (!CONFIG.CHAT_LOG_WEBHOOK) return;
  fetch(CONFIG.CHAT_LOG_WEBHOOK, {
    method: "POST",
    body: JSON.stringify({
      userMessage,
      botReply,
      botType: "Restaurant Bot",
    }),
  }).catch(() => {}); // silent fail — never disrupts chat
}

async function sendMessage(text) {
  const userText = (text || chatInput.value).trim();
  if (!userText || isTyping) return;

  chatInput.value = "";
  chatInput.style.height = "auto";
  isTyping = true;
  sendBtn.disabled = true;

  addMessage("user", userText);
  messages.push({ role: "user", content: userText });

  showTyping();

  try {
    // Check API key
    if (CONFIG.GROQ_API_KEY === "YOUR_GROQ_API_KEY_HERE") {
      throw new Error("API_KEY_MISSING");
    }

    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${CONFIG.GROQ_API_KEY}`,
      },
      body: JSON.stringify({
        model: "llama-3.3-70b-versatile",
        max_tokens: 400,
        messages: [
          { role: "system", content: buildSystemPrompt() },
          ...messages,
        ],
      }),
    });

    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const data = await response.json();
    const reply = data.choices[0].message.content;

    removeTyping();
    addMessage("bot", reply);
    messages.push({ role: "assistant", content: reply });
    logChat(userText, reply);

  } catch (err) {
    removeTyping();
    let errMsg;
    if (err.message === "API_KEY_MISSING") {
      errMsg = "⚠️ Please add your Groq API key in the CONFIG section at the top of this file. Get a free key at **console.groq.com**";
    } else {
      errMsg = "Sorry, I'm having trouble connecting right now. Please call us at **" + CONFIG.phone + "** for assistance.";
    }
    addMessage("bot", errMsg);
  }

  isTyping = false;
  sendBtn.disabled = false;
  chatInput.focus();
}

// ── Input Events ──
sendBtn.addEventListener("click", () => sendMessage());

chatInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

chatInput.addEventListener("input", () => {
  chatInput.style.height = "auto";
  chatInput.style.height = Math.min(chatInput.scrollHeight, 100) + "px";
});
</script>
</body>
</html>
