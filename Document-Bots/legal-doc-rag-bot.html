<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LexAI — Legal Document Assistant</title>
<script>
const CONFIG = {
  appName: "LexAI",
  documentTitle: "Software Development Agreement",
  documentType: "Service Contract",
  documentPages: "28 pages",
  parties: "Orion Digital Ltd. & NovaBuild Inc.",
  colorPrimary: "#1c1c2e",
  colorAccent: "#c9a84c",
  colorBg: "#f5f4f0",
  groqApiKey: "YOUR_GROQ_API_KEY_HERE",
  groqModel: "llama-3.1-8b-instant",
  welcomeMessage: "I've analyzed the Software Development Agreement between Orion Digital Ltd. and NovaBuild Inc. Ask me about payment terms, IP ownership, confidentiality, termination clauses, or any other section.",
  suggestions: [
    "Who owns the intellectual property?",
    "What are the payment terms?",
    "What happens if the contract is terminated?",
    "What does the NDA cover?"
  ],
  knowledgeBase: `You are LexAI, an AI legal document assistant. You have fully analyzed the "Software Development Agreement" (28 pages) between Orion Digital Ltd. (Client) and NovaBuild Inc. (Developer). Answer questions accurately, cite specific clauses when relevant, and always remind users that you provide document summaries — not legal advice.

IMPORTANT DISCLAIMER: Always end responses with a note that this is for informational purposes only and not legal advice.

---
DOCUMENT: Software Development Agreement
PARTIES: 
- Client: Orion Digital Ltd., registered in Dubai, UAE
- Developer: NovaBuild Inc., registered in Lahore, Pakistan
- Effective Date: January 1, 2025
- Contract Duration: 12 months (renewable)

CLAUSE 1 — SCOPE OF WORK
- Developer shall design, develop, and deliver a custom e-commerce platform as specified in Schedule A
- Deliverables include: frontend UI, backend API, admin dashboard, mobile app (iOS + Android), and documentation
- Developer may engage sub-contractors only with prior written consent from Client (Clause 1.4)
- Any changes to scope require a signed Change Order Form; no verbal agreements are binding (Clause 1.6)

CLAUSE 2 — PROJECT TIMELINE
- Phase 1 (UI/UX Design): Weeks 1–4
- Phase 2 (Backend Development): Weeks 5–12
- Phase 3 (Frontend Integration): Weeks 13–18
- Phase 4 (Testing & QA): Weeks 19–22
- Phase 5 (Deployment & Handover): Weeks 23–24
- Delays caused by Client extend deadlines proportionally (Clause 2.3)
- Developer must notify Client of potential delays at least 7 days in advance (Clause 2.4)

CLAUSE 3 — PAYMENT TERMS
- Total contract value: USD 85,000
- Payment schedule:
  20% upfront upon contract signing (USD 17,000)
  20% upon completion of Phase 1 (USD 17,000)
  30% upon completion of Phase 3 (USD 25,500)
  30% upon final delivery and acceptance (USD 25,500)
- Invoices must be paid within 14 days of issuance
- Late payment penalty: 1.5% per month on outstanding amount
- Client may withhold up to 10% of final payment for 30 days post-launch as retention (Clause 3.8)

CLAUSE 4 — INTELLECTUAL PROPERTY
- All custom code, designs, and deliverables become property of Client upon full payment (Clause 4.1)
- Developer retains ownership of all pre-existing tools, frameworks, and libraries used (Clause 4.2)
- Developer grants Client a perpetual, royalty-free license to use pre-existing components (Clause 4.3)
- Developer may NOT use Client deliverables in their portfolio without written consent (Clause 4.4)
- Open-source components must carry permissive licenses (MIT, Apache 2.0) (Clause 4.5)

CLAUSE 5 — CONFIDENTIALITY (NDA)
- Both parties keep all non-public information confidential for 3 years post-contract
- Confidential info includes: source code, business data, pricing, user data, technical specs
- Developer must ensure all sub-contractors sign equivalent NDAs before starting work
- Breach of confidentiality may result in immediate termination and damages claim (Clause 5.6)

CLAUSE 6 — WARRANTIES & LIABILITIES
- Developer warrants deliverables will be free of defects for 90 days post-delivery (Clause 6.1)
- Developer will fix reported bugs at no extra cost within the 90-day warranty period
- Neither party is liable for indirect, incidental, or consequential damages (Clause 6.4)
- Total liability of either party is capped at the total contract value (USD 85,000) (Clause 6.5)
- Force majeure events suspend obligations without penalty (Clause 6.7)

CLAUSE 7 — TERMINATION
- Either party may terminate with 30 days written notice (Clause 7.1)
- Client may terminate immediately if Developer breaches material term and fails to cure within 15 days (Clause 7.2)
- Developer may terminate immediately if Client fails to pay within 30 days of due date (Clause 7.3)
- Upon termination: Developer delivers all work completed to date; Client pays pro-rata (Clause 7.4)
- Clauses 4 (IP), 5 (NDA), and 6 (Liability) survive termination (Clause 7.5)

CLAUSE 8 — DISPUTE RESOLUTION
- Parties attempt good-faith negotiation first (30 days)
- If unresolved, disputes go to mediation in Dubai, UAE
- If mediation fails, binding arbitration under DIAC rules
- Governing law: UAE law

CLAUSE 9 — GENERAL PROVISIONS
- Amendments require written consent of both parties
- Neither party may assign this contract without written consent of the other (Clause 9.6)

Always cite the relevant clause (e.g., "According to Clause 4.1..."). Be clear and precise. Always end with: "This is for informational purposes only and not legal advice. Please consult a qualified attorney for legal guidance."`
};
</script>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Mulish:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #1c1c2e;
    --accent: #c9a84c;
    --bg: #f5f4f0;
    --surface: #ffffff;
    --text: #1a1a1a;
    --text-muted: #7a7068;
    --border: #e4e0d8;
    --radius: 12px;
  }
  body {
    font-family: 'Mulish', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background-image:
      radial-gradient(ellipse 80% 40% at 50% 0%, rgba(28,28,46,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 60% 50% at 90% 100%, rgba(201,168,76,0.07) 0%, transparent 70%);
  }
  .app-row {
    width: 100%; max-width: 520px;
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px; padding: 0 2px;
  }
  .app-wordmark { display: flex; align-items: center; gap: 9px; }
  .wordmark-icon {
    width: 30px; height: 30px; background: var(--primary);
    border-radius: 7px; display: flex; align-items: center; justify-content: center;
    font-family: 'Libre Baskerville', serif; font-weight: 700; font-size: 13px; color: var(--accent);
  }
  .wordmark-text { font-family: 'Libre Baskerville', serif; font-size: 16px; font-weight: 700; color: var(--primary); }
  .ai-badge { font-size: 10px; background: #fff8e8; color: var(--accent); border: 1px solid rgba(201,168,76,0.3); padding: 3px 10px; border-radius: 20px; font-weight: 600; letter-spacing: 0.05em; }
  .doc-header { width: 100%; max-width: 520px; background: var(--primary); border-radius: var(--radius) var(--radius) 0 0; overflow: hidden; }
  .doc-main { padding: 18px 20px 14px; display: flex; align-items: flex-start; gap: 14px; }
  .seal { width: 48px; height: 48px; border: 2px solid var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; background: rgba(201,168,76,0.08); }
  .doc-details { flex: 1; }
  .doc-type-tag { font-size: 9px; font-weight: 700; color: var(--accent); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 4px; }
  .doc-details h2 { font-family: 'Libre Baskerville', serif; font-size: 15px; font-weight: 700; color: #fff; line-height: 1.3; }
  .doc-details .parties { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 4px; font-weight: 300; font-style: italic; }
  .doc-status { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex-shrink: 0; }
  .status-pill { font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 4px; letter-spacing: 0.04em; }
  .status-pill.analyzed { background: rgba(201,168,76,0.15); color: var(--accent); border: 1px solid rgba(201,168,76,0.25); }
  .status-pill.pages    { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.4); border: 1px solid rgba(255,255,255,0.1); }
  .clause-strip { padding: 8px 20px; background: rgba(201,168,76,0.07); border-top: 1px solid rgba(201,168,76,0.12); display: flex; gap: 6px; flex-wrap: wrap; }
  .clause-chip { font-size: 10px; color: rgba(255,255,255,0.35); background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); padding: 2px 8px; border-radius: 4px; font-weight: 500; }
  .chat-window { width: 100%; max-width: 520px; background: var(--surface); border: 1px solid var(--border); border-top: none; border-radius: 0 0 var(--radius) var(--radius); display: flex; flex-direction: column; height: 510px; overflow: hidden; box-shadow: 0 12px 40px rgba(28,28,46,0.10); }
  .messages { flex: 1; overflow-y: auto; padding: 18px 16px 10px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
  .messages::-webkit-scrollbar { width: 3px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .msg { display: flex; gap: 10px; max-width: 92%; animation: rise 0.22s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.bot  { align-self: flex-start; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: 'Libre Baskerville', serif; font-size: 11px; font-weight: 700; }
  .msg.bot  .avatar { background: var(--primary); color: var(--accent); }
  .msg.user .avatar { background: #eeebe4; color: var(--text-muted); font-family: sans-serif; font-size: 13px; }
  .bubble { padding: 10px 14px; font-size: 13.5px; line-height: 1.7; color: var(--text); }
  .msg.bot  .bubble { background: #faf9f6; border: 1px solid var(--border); border-radius: 3px 12px 12px 12px; }
  .msg.user .bubble { background: var(--primary); color: #fff; border-radius: 12px 3px 12px 12px; }
  .source-tag { display: inline-flex; align-items: center; gap: 4px; margin-top: 7px; font-size: 10px; color: var(--accent); background: #fff8e8; border: 1px solid rgba(201,168,76,0.25); padding: 2px 8px; border-radius: 4px; font-weight: 600; }
  .typing-dots { display: flex; align-items: center; gap: 5px; padding: 11px 14px; background: #faf9f6; border: 1px solid var(--border); border-radius: 3px 12px 12px 12px; width: fit-content; }
  .typing-dots span { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; opacity: 0.4; animation: tdot 1.2s infinite; }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes tdot { 0%, 80%, 100% { transform: translateY(0); opacity: 0.4; } 40% { transform: translateY(-5px); opacity: 1; } }
  .suggestions { padding: 10px 14px 8px; display: flex; gap: 7px; flex-wrap: wrap; border-top: 1px solid var(--border); background: #fdfcf8; }
  .suggestion-btn { padding: 5px 11px; font-family: 'Mulish', sans-serif; font-size: 12px; font-weight: 600; background: #fff; border: 1px solid var(--border); color: var(--primary); border-radius: 6px; cursor: pointer; transition: all 0.18s; white-space: nowrap; }
  .suggestion-btn:hover { border-color: var(--accent); color: #8a6a1a; background: #fff8e8; }
  .input-bar { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #fff; border-top: 1px solid var(--border); }
  .input-bar input { flex: 1; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-family: 'Mulish', sans-serif; font-size: 14px; color: var(--text); background: var(--bg); outline: none; transition: border-color 0.2s; }
  .input-bar input:focus { border-color: var(--accent); }
  .input-bar input::placeholder { color: var(--text-muted); }
  .send-btn { width: 38px; height: 38px; border-radius: 8px; background: var(--primary); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity 0.2s, transform 0.1s; flex-shrink: 0; }
  .send-btn:hover { opacity: 0.82; }
  .send-btn:active { transform: scale(0.92); }
  .send-btn svg { width: 15px; height: 15px; fill: var(--accent); }
  .powered { margin-top: 14px; font-size: 11px; color: var(--text-muted); }
  .powered span { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<div class="app-row">
  <div class="app-wordmark">
    <div class="wordmark-icon" id="wordmarkIcon"></div>
    <span class="wordmark-text" id="appName"></span>
  </div>
  <div class="ai-badge">AI-POWERED</div>
</div>
<div class="doc-header">
  <div class="doc-main">
    <div class="seal">⚖️</div>
    <div class="doc-details">
      <div class="doc-type-tag" id="docType"></div>
      <h2 id="docTitle"></h2>
      <div class="parties" id="parties"></div>
    </div>
    <div class="doc-status">
      <div class="status-pill analyzed">✓ Analyzed</div>
      <div class="status-pill pages" id="docPages"></div>
    </div>
  </div>
  <div class="clause-strip">
    <span class="clause-chip">Clause 1 — Scope</span>
    <span class="clause-chip">Clause 3 — Payment</span>
    <span class="clause-chip">Clause 4 — IP</span>
    <span class="clause-chip">Clause 5 — NDA</span>
    <span class="clause-chip">Clause 7 — Termination</span>
  </div>
</div>
<div class="chat-window">
  <div class="messages" id="messages"></div>
  <div class="suggestions" id="suggestionsRow"></div>
  <div class="input-bar">
    <input type="text" id="userInput" placeholder="Ask about any clause or term…" autocomplete="off" />
    <button class="send-btn" id="sendBtn" aria-label="Send">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>
<p class="powered">Powered by <span>RAG Chatbot</span> · Built on Fiverr by KumailH12</p>
<script>
document.documentElement.style.setProperty('--primary', CONFIG.colorPrimary);
document.documentElement.style.setProperty('--accent', CONFIG.colorAccent);
document.getElementById('wordmarkIcon').textContent = CONFIG.appName.slice(0,2);
document.getElementById('appName').textContent = CONFIG.appName;
document.getElementById('docType').textContent = CONFIG.documentType;
document.getElementById('docTitle').textContent = CONFIG.documentTitle;
document.getElementById('parties').textContent = CONFIG.parties;
document.getElementById('docPages').textContent = CONFIG.documentPages;

const suggestionsRow = document.getElementById('suggestionsRow');
CONFIG.suggestions.forEach(text => {
  const btn = document.createElement('button');
  btn.className = 'suggestion-btn';
  btn.textContent = text;
  btn.onclick = () => sendMessage(text);
  suggestionsRow.appendChild(btn);
});

const messagesEl = document.getElementById('messages');
const inputEl    = document.getElementById('userInput');
const sendBtnEl  = document.getElementById('sendBtn');
let conversationHistory = [];

function appendMessage(role, text, showSource) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'bot' ? 'Lx' : '👤';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  if (role === 'bot' && showSource) {
    bubble.appendChild(document.createElement('br'));
    const tag = document.createElement('span');
    tag.className = 'source-tag';
    tag.textContent = '📄 ' + CONFIG.documentTitle;
    bubble.appendChild(tag);
  }
  wrap.appendChild(avatar);
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'msg bot'; wrap.id = 'typing';
  const avatar = document.createElement('div');
  avatar.className = 'avatar'; avatar.textContent = 'Lx';
  const dots = document.createElement('div');
  dots.className = 'typing-dots';
  dots.innerHTML = '<span></span><span></span><span></span>';
  wrap.appendChild(avatar); wrap.appendChild(dots);
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTyping() { const t = document.getElementById('typing'); if (t) t.remove(); }

async function sendMessage(text) {
  const msg = (text || inputEl.value).trim();
  if (!msg) return;
  inputEl.value = ''; sendBtnEl.disabled = true;
  suggestionsRow.style.display = 'none';
  appendMessage('user', msg, false);
  conversationHistory.push({ role: 'user', content: msg });
  showTyping();
  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + CONFIG.groqApiKey },
      body: JSON.stringify({
        model: CONFIG.groqModel,
        messages: [{ role: 'system', content: CONFIG.knowledgeBase.trim() }, ...conversationHistory],
        temperature: 0.3, max_tokens: 500
      })
    });
    const data = await res.json();
    removeTyping();
    const reply = data?.choices?.[0]?.message?.content || "I couldn't locate that in the document. Please consult a qualified attorney.";
    conversationHistory.push({ role: 'assistant', content: reply });
    appendMessage('bot', reply, true);
  } catch (err) {
    removeTyping();
    appendMessage('bot', "Something went wrong. Please try again.", false);
    console.error(err);
  }
  sendBtnEl.disabled = false; inputEl.focus();
}

window.addEventListener('load', () => { setTimeout(() => appendMessage('bot', CONFIG.welcomeMessage, false), 500); });
sendBtnEl.addEventListener('click', () => sendMessage());
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
</script>
</body>
</html>
